name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # NOTE: PyPI publish is deferred for v0.8.0; v0.8.0 ships via Docker
  # (image job below) + git-install through scripts/install.sh. See
  # TODO.md "next ship" → release for the re-enable criteria.
  image:
    name: build + publish container to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          ref="${GITHUB_REF_NAME#v}"
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "owner_lc=${owner_lc}"
            echo "tag=${ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch: most home-LAN users are arm64 (Apple silicon)
          # or amd64 (Linux servers). Skip armv7 — too rare to justify
          # the build time.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/swf-node:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/swf-node:latest
