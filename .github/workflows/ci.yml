name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel in-flight runs on the same ref when a new push lands. PRs
  # benefit the most: pushing a fixup mid-CI doesn't burn a duplicate
  # run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,community-full]'

      - name: pytest (default markers, no live SearXNG, no slow)
        run: |
          pytest -q -m 'not searxng_live and not slow and not integration' \
            --cov=swf --cov-report=xml --cov-report=term \
            --deselect tests/search/test_router.py::test_router_no_results_when_indrex_empty
        env:
          # Force loopback on CI so mDNS register attempts don't hang
          # waiting for a network. The tests that exercise mDNS use
          # explicit fixtures.
          SWF_BIND: 127.0.0.1

      - name: Upload coverage (Linux + 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  self-check:
    name: swf-node --check (ubuntu · py3.12)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[community-full]'
      - run: swf-node --check

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.6'
      - run: ruff check src/ tests/
