# examples/nginx/swf-node.conf — reverse-proxy swf-node with split auth.
#
# Same posture as the Caddyfile in ../caddy/: swf-node bound to
# 127.0.0.1:7777, peer routes pass through, agent routes require
# `Authorization: Bearer <SWF_AGENT_TOKEN>`.
#
# nginx doesn't read env vars at request time, so the token has to be
# baked into the config at deploy time. Recommended: render this file
# from a template via envsubst before reload, e.g.
#     envsubst '${SWF_AGENT_TOKEN}' < swf-node.conf.tmpl > swf-node.conf
#
# Or use auth_request to delegate to a tiny upstream that checks the
# token; left as an exercise.

server {
    listen 443 ssl http2;
    server_name node.example.com;

    # ssl_certificate /etc/letsencrypt/live/node.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/node.example.com/privkey.pem;

    # Peer-protocol routes — responses are Ed25519-signed; no extra auth.
    location ~ ^/(\.well-known/indrex|search|slices/|community/|digest/) {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Agent routes — bearer-token gate.
    location ~ ^/(web_search|local_search|fetch_url|fetch_urls)$ {
        # NOTE: ${SWF_AGENT_TOKEN} is rendered at deploy time via
        # envsubst — nginx itself can't read env vars dynamically.
        if ($http_authorization != "Bearer ${SWF_AGENT_TOKEN}") {
            return 401;
        }
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
    }

    # Health — no auth.
    location = /health {
        proxy_pass http://127.0.0.1:7777;
    }

    # Default deny.
    location / {
        return 404;
    }
}
