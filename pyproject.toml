[project]
name = "swf-node"
version = "0.13.1"
description = "swf-node — self-sovereign LAN-first peer search. A Python daemon that maintains a local FTS5 indrex of pages you fetch and shares signed bundles with mDNS-discovered LAN peers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dmarz" }]
keywords = ["search", "p2p", "self-sovereign", "fts5", "lan", "mdns", "searxng"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: System :: Networking",
]
dependencies = [
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "zeroconf>=0.130",
    "cryptography>=42.0",
    # pyrage drives the age-v1 encryption path used by `cohort.depth` and
    # encrypted `transcript.batch` bundles (#93 phase 7, spec §3.6). It's
    # the maintained Python binding to the Rust `rage` library and ships
    # cp39-abi3 wheels for macOS x86_64/arm64 (universal2) and manylinux
    # x86_64 — both of swf-node's deploy targets — so no Rust toolchain
    # is required at install time. We never decrypt in swf-node (per
    # spec); pyrage's recipient-side API is all we use.
    "pyrage>=1.1",
    # psutil powers the self-contained metrics collector
    # (community_full/metrics.py): RSS / CPU% / fd count, sampled on the
    # background tick. Used purely for local introspection — no network I/O.
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/dmarzzz/searxng-wth-frnds"
Repository = "https://github.com/dmarzzz/searxng-wth-frnds"
Issues = "https://github.com/dmarzzz/searxng-wth-frnds/issues"
Changelog = "https://github.com/dmarzzz/searxng-wth-frnds/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
test = [
    "pytest>=8.0",
]
# install with `pip install -e '.[community-full]'` on the wall laptop /
# any host that aggregates contributions from peers. Plain peers don't
# need any of these.
# Aggregator routes are served by swf-node's own ThreadingHTTPServer
# (single port, single binary), so we no longer need FastAPI/uvicorn.
community-full = [
    "pynacl>=1.5",
]

[project.scripts]
# swf-node is the canonical name. swf-peer-server and swf-agent-server are
# kept as deprecated aliases (one cycle). All three forward to the same
# unified entry point. The agent-server's routes (/web_search, /fetch_url,
# /fetch_urls, /local_search) are served by swf-node directly with
# Deprecation headers pointing at the new names.
swf-node = "swf.peer_server:main"
swf-peer-server = "swf.peer_server:main"
swf-agent-server = "swf.peer_server:main"
swf-peer = "swf.peer_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swf"]

[tool.hatch.build.targets.wheel.shared-data]
# include the (trimmed-to-metrics-only) SQL schema in the wheel
"src/swf/community_full/schema.sql" = "swf/community_full/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # TODO-14 live SearXNG fixture. Tests under this marker hit a real
    # SearXNG container on http://127.0.0.1:8888 (see
    # docker-compose.searxng-test.yml) so they can catch upstream JSON
    # regressions the mock-based suite would miss. They are opt-in —
    # `pytest -q` skips them, `pytest -m searxng_live` runs them.
    "searxng_live: requires a live SearXNG on http://127.0.0.1:8888",
    # Tests that hit real network (DDG, public sites). Skipped by
    # default; run with `-m network` when you actually want them.
    "network: hits real public network endpoints",
    # Tests that take >5s. Skipped in default CI; run with `-m slow`.
    "slow: noticeably slow tests (>5s)",
    # Multi-peer wire-protocol tests. Spin up real ThreadingHTTPServer
    # instances and exercise the bundle pull/push path end-to-end.
    "integration: multi-process / multi-peer integration tests",
]
# `-m 'not searxng_live'` keeps the default run mock-only. Anyone who
# wants the live tests passes `-m searxng_live` explicitly (or
# `-m 'searxng_live or not searxng_live'` for everything).
addopts = "-m 'not searxng_live'"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "runs",
    "traces",
    "bench/timing_report.json",
]

[tool.ruff.lint]
# Conservative selection for an alpha project — lint the obvious
# things, don't fight the codebase. Tighten over time.
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear (catches real bugs)
    "UP",    # pyupgrade (modernize syntax for target-version)
    "SIM",   # simplify (low-noise suggestions)
]
ignore = [
    "E501",  # line-length handled by formatter intent; some long
             # SQL strings and URLs are not worth wrapping
    "B008",  # function calls in default args are idiomatic in some
             # places (e.g. dataclass field factories); review
             # case-by-case
    "SIM108", # ternary instead of if/else — sometimes worse readability
]

[tool.ruff.lint.per-file-ignores]
# Tests get a more lenient ruleset — fixtures and monkeypatch trickery
# trigger several rules that would only add noise.
"tests/**/*.py" = ["B011", "SIM117", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["swf"]
